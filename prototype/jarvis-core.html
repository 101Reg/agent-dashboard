<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Agent OS · Core</title>
<style>
  html,body{margin:0;height:100%;background:#050608;overflow:hidden;
    font-family:'SF Mono',ui-monospace,Menlo,monospace;color:#cfe6ff;}
  #stage{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}
  /* vignette + faint scanlines for the Jarvis HUD feel */
  #stage::after{content:'';position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0,0,0,0.55) 100%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 3px);}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
    font-size:10px;letter-spacing:.18em;color:rgba(123,200,255,.35);
    text-transform:uppercase;pointer-events:none;
    opacity:0;animation:fadein 1s 3.2s forwards;}
  @keyframes fadein{to{opacity:1}}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="hint">click anywhere · simulate agent activity</div>
<script>
// ---- real Agent OS values (from data.json 2026-06-17) ----
const SCORE = 67;                 // Loop Health conversion %
const AGENTS = ['Gil','Tony','infra','Johnny','Sky','Bruce','research','reviewer'];
const STATS  = [['SKILLS',26],['RULES',22],['HOOKS',16],['MEMORY',108],['MCP',2]];
const NIGHT_SHIFT = 'RED';
const LINES = [
  'LOOP HEALTH 67% — DOWN FROM 164% LAST WEEK',
  'NIGHT SHIFT // RED — EVAL SIGNAL RATE FLAGGED',
  '6 FAILURES · 4 PREVENTIONS THIS WEEK',
  '108 MEMORY FILES · 22 RULES · 16 HOOKS ACTIVE',
  '8 AGENTS ONLINE · BRUCE STANDING BY',
];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W,H,CX,CY,DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX = W/2; CY = H*0.46;
}
window.addEventListener('resize', resize); resize();

// health → hue: red(0) … amber(45) … cyan(190) by score
const hue = 8 + (SCORE/100)*150;          // 67% ≈ amber-gold
const COL = (a)=>`hsla(${hue},90%,60%,${a})`;
const CYAN = (a)=>`hsla(195,90%,62%,${a})`;

const T0 = performance.now();
const ease = t => 1 - Math.pow(1-Math.min(Math.max(t,0),1), 3);

// activity pulses (node -> core)
const pulses = [];
function fireRandom(){
  const i = Math.floor(Math.random()*AGENTS.length);
  pulses.push({i, t:0, life:1.1});
}
function radius(){ return Math.min(W,H)*0.30; }

cv.addEventListener('pointerdown', e=>{
  // nearest agent to click gets a pulse
  const ang0 = orbitAngle();
  const r = radius();
  let best=0, bd=1e9;
  AGENTS.forEach((_,i)=>{
    const a = ang0 + i/AGENTS.length*Math.PI*2;
    const x=CX+Math.cos(a)*r, y=CY+Math.sin(a)*r;
    const d=(x-e.clientX)**2+(y-e.clientY)**2;
    if(d<bd){bd=d;best=i;}
  });
  pulses.push({i:best,t:0,life:1.1});
  coreFlash = 1;
});
let coreFlash = 0;

function orbitAngle(){ return (performance.now()-T0)/9000; }

let lastFire = 0;
function frame(now){
  const t = (now - T0)/1000;        // seconds since boot
  // boot timeline
  const ringsIn = ease(t/0.9);
  const scoreIn = ease((t-0.7)/1.0);
  const agentsIn = (t-1.1);
  const lineIn = (t-2.4);

  // ambient auto-fire
  if(now-lastFire > 1500 + Math.random()*1400){ fireRandom(); lastFire = now; }

  ctx.clearRect(0,0,W,H);

  // ---- faint HUD grid ----
  ctx.globalAlpha = 0.05*ringsIn;
  ctx.strokeStyle = CYAN(1); ctx.lineWidth = 1;
  for(let gx=0; gx<W; gx+=40){ ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke(); }
  for(let gy=0; gy<H; gy+=40){ ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke(); }
  ctx.globalAlpha = 1;

  const rot = now/1000;
  const R = radius();

  // ---- rotating tick rings (Jarvis) ----
  function tickRing(rad, ticks, len, speed, alpha){
    ctx.save(); ctx.translate(CX,CY); ctx.rotate(rot*speed);
    ctx.strokeStyle = CYAN(alpha*ringsIn); ctx.lineWidth=1.5;
    for(let k=0;k<ticks;k++){
      const a = k/ticks*Math.PI*2;
      const c=Math.cos(a),s=Math.sin(a);
      ctx.beginPath();
      ctx.moveTo(c*rad, s*rad); ctx.lineTo(c*(rad+len), s*(rad+len));
      ctx.stroke();
    }
    ctx.restore();
  }
  tickRing(R*0.92, 60, 6, 0.12, 0.5);
  tickRing(R*1.18, 36, 10, -0.07, 0.35);
  tickRing(R*1.30, 90, 4, 0.05, 0.2);

  // ---- progress arc = score ----
  ctx.save(); ctx.translate(CX,CY);
  ctx.strokeStyle = COL(0.12*ringsIn); ctx.lineWidth=10;
  ctx.beginPath(); ctx.arc(0,0,R*0.62,0,Math.PI*2); ctx.stroke();
  const sweep = (SCORE/100)*Math.PI*2*scoreIn;
  ctx.strokeStyle = COL(0.95); ctx.lineWidth=10; ctx.lineCap='round';
  ctx.shadowColor = COL(0.9); ctx.shadowBlur = 24;
  ctx.beginPath(); ctx.arc(0,0,R*0.62,-Math.PI/2,-Math.PI/2+sweep); ctx.stroke();
  ctx.shadowBlur=0; ctx.restore();

  // ---- core breathing orb ----
  const breathe = 1 + Math.sin(now/700)*0.04;
  const flash = coreFlash; coreFlash *= 0.92;
  const cr = R*0.40*ringsIn*breathe;
  const g = ctx.createRadialGradient(CX,CY,0,CX,CY,cr);
  g.addColorStop(0, COL(0.55+flash*0.4));
  g.addColorStop(0.5, COL(0.18));
  g.addColorStop(1, COL(0));
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(CX,CY,cr,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=COL(0.5*ringsIn); ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(CX,CY,R*0.40*breathe,0,Math.PI*2); ctx.stroke();

  // ---- score text (count up) ----
  const shown = Math.round(SCORE*scoreIn);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle=COL(0.98);
  ctx.font=`700 ${Math.round(R*0.32)}px 'SF Mono',monospace`;
  ctx.shadowColor=COL(0.7); ctx.shadowBlur=18;
  ctx.fillText(shown+'%', CX, CY-R*0.02);
  ctx.shadowBlur=0;
  ctx.fillStyle=CYAN(0.55*scoreIn);
  ctx.font=`600 ${Math.round(R*0.07)}px 'SF Mono',monospace`;
  ctx.fillText('L O O P   H E A L T H', CX, CY+R*0.20);

  // night-shift alert pip
  if(scoreIn>0.5){
    const blink = 0.5+0.5*Math.sin(now/300);
    ctx.fillStyle=`hsla(0,90%,60%,${blink})`;
    ctx.beginPath(); ctx.arc(CX+R*0.30, CY-R*0.30, 4, 0, Math.PI*2); ctx.fill();
  }

  // ---- agent constellation ----
  const ang0 = orbitAngle();
  const nodePos=[];
  AGENTS.forEach((name,i)=>{
    const appear = ease(agentsIn - i*0.12);
    if(appear<=0){ nodePos.push(null); return; }
    const a = ang0 + i/AGENTS.length*Math.PI*2;
    const x = CX+Math.cos(a)*R, y = CY+Math.sin(a)*R;
    nodePos.push({x,y});
    // connector
    ctx.strokeStyle=CYAN(0.12*appear); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(x,y); ctx.stroke();
    // node
    const pop = appear<1 ? 1+(1-appear)*1.4 : 1;
    ctx.fillStyle=CYAN(0.9*appear);
    ctx.shadowColor=CYAN(0.8); ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(x,y,3.2*pop,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle=CYAN(0.3*appear);
    ctx.beginPath(); ctx.arc(x,y,8*pop,0,Math.PI*2); ctx.stroke();
    // label
    ctx.fillStyle=CYAN(0.8*appear);
    ctx.font=`600 11px 'SF Mono',monospace`;
    ctx.textAlign = Math.cos(a)>0.2?'left':Math.cos(a)<-0.2?'right':'center';
    const lx = x+Math.cos(a)*14, ly = y+Math.sin(a)*14;
    ctx.fillText(name.toUpperCase(), lx, ly);
  });

  // ---- activity pulses node -> core ----
  for(let p=pulses.length-1;p>=0;p--){
    const pl=pulses[p]; pl.t += 1/60/pl.life;
    const np = nodePos[pl.i]; if(!np){ pulses.splice(p,1); continue; }
    if(pl.t>=1){ pulses.splice(p,1); coreFlash=Math.max(coreFlash,0.8); continue; }
    const tt=ease(pl.t);
    const x = np.x+(CX-np.x)*tt, y=np.y+(CY-np.y)*tt;
    // trail
    ctx.strokeStyle=COL(0.5*(1-pl.t)); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(np.x,np.y); ctx.lineTo(x,y); ctx.stroke();
    ctx.fillStyle=COL(1); ctx.shadowColor=COL(1); ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(x,y,3.5,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    // light the source node
    ctx.fillStyle=COL(0.9*(1-pl.t));
    ctx.beginPath(); ctx.arc(np.x,np.y,6,0,Math.PI*2); ctx.fill();
  }

  // ---- corner HUD stat readouts ----
  if(scoreIn>0.4){
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    STATS.forEach((s,i)=>{
      const yy = 40 + i*22;
      const ap = ease((t-1.4-i*0.1));
      if(ap<=0) return;
      ctx.fillStyle=CYAN(0.3*ap); ctx.font=`600 10px 'SF Mono',monospace`;
      ctx.fillText(s[0], 24, yy);
      ctx.fillStyle=CYAN(0.85*ap); ctx.font=`700 14px 'SF Mono',monospace`;
      ctx.fillText(String(s[1]), 92, yy);
    });
  }

  // ---- bottom typewriter status line ----
  if(lineIn>0){
    const period = 3.4;
    const idx = Math.floor(lineIn/period) % LINES.length;
    const local = (lineIn % period);
    const msg = LINES[idx];
    const chars = Math.min(msg.length, Math.floor(local/0.03));
    const fade = local>period-0.5 ? (period-local)/0.5 : 1;
    const shownTxt = msg.slice(0,chars) + (chars<msg.length && Math.sin(now/120)>0?'▋':'');
    ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillStyle=CYAN(0.7*Math.max(fade,0.15));
    ctx.font=`600 13px 'SF Mono',monospace`;
    ctx.fillText('› '+shownTxt, CX, H-70);
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
